<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResonantDAO Example</title>
  <link rel="stylesheet" href="/src/theme.css" />
</head>
<body>
  <div id="app">
    <!-- Auth stage -->
    <main id="auth" class="auth-stage">
      <div class="auth-card" role="tabpanel" aria-label="Authentication">
        <div class="auth-card__brand">
          <h1>Resonant<span>DAO</span></h1>
          <p>Contribution economy demo</p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Register or login">
          <button id="tab-register" class="auth-tab" type="button" role="tab" aria-selected="true" aria-controls="register-panel">
            Register
          </button>
          <button id="tab-login" class="auth-tab" type="button" role="tab" aria-selected="false" aria-controls="login-panel">
            Login
          </button>
        </div>

        <div id="register-panel" class="auth-form" role="tabpanel" aria-labelledby="tab-register">
          <form id="register-form" class="auth-form">
            <div class="form-group">
              <label class="form-label" for="register-username">Username</label>
              <input id="register-username" class="form-input" type="text" autocomplete="username" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="register-password">Password</label>
              <input id="register-password" class="form-input" type="password" autocomplete="new-password" required />
              <div id="password-strength" class="password-strength" aria-live="polite" aria-atomic="true"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="register-password-confirm">Confirm password</label>
              <input id="register-password-confirm" class="form-input" type="password" autocomplete="new-password" required />
            </div>
            <button class="button button--primary" type="submit">Create account</button>
          </form>
        </div>

        <div id="login-panel" class="auth-form hidden" role="tabpanel" aria-labelledby="tab-login">
          <form id="login-form" class="auth-form">
            <div class="form-group">
              <label class="form-label" for="login-username">Username</label>
              <input id="login-username" class="form-input" type="text" autocomplete="username" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="login-password">Password</label>
              <input id="login-password" class="form-input" type="password" autocomplete="current-password" required />
            </div>
            <button class="button button--primary" type="submit">Sign in</button>
          </form>
        </div>
      </div>
    </main>

    <!-- Dashboard stage -->
    <div id="dashboard" class="app-shell hidden">
      <header class="app-header">
        <div class="app-header__brand">Resonant<span>DAO</span></div>
        <div class="app-header__user">
          <span id="username"></span>
          <button id="logout" class="button button--secondary button--small" type="button">Logout</button>
        </div>
      </header>

      <main class="app-main">
        <div class="dashboard">
          <aside class="dashboard__panel">
            <section class="section-card" aria-labelledby="members-title">
              <div class="section-card__header">
                <h2 id="members-title" class="section-card__title">Members</h2>
              </div>
              <ul id="members" class="member-list"></ul>
            </section>
          </aside>

          <div class="dashboard__panel">
            <section class="section-card" aria-labelledby="create-title">
              <div class="section-card__header">
                <h2 id="create-title" class="section-card__title">New proposal</h2>
              </div>
              <form id="proposal-form" class="proposal-form">
                <div class="form-group">
                  <label class="form-label" for="proposal-title">Title</label>
                  <input id="proposal-title" class="form-input" type="text" placeholder="What do you want to propose?" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="proposal-description">Description</label>
                  <input id="proposal-description" class="form-input" type="text" placeholder="Optional details" />
                </div>
                <div class="proposal-form__actions">
                  <button class="button button--primary" type="submit">Create proposal</button>
                </div>
              </form>
            </section>

            <section class="section-card" aria-labelledby="proposals-title">
              <div class="section-card__header">
                <h2 id="proposals-title" class="section-card__title">Proposals</h2>
              </div>
              <ul id="proposals" class="proposal-list"></ul>
            </section>
          </div>
        </div>
      </main>

      <footer class="app-footer">
        ResonantDAO Example — browser-based DAO proof of concept
      </footer>
    </div>

    <div id="status" class="status-bar status-bar--neutral" role="status" aria-live="polite"></div>
  </div>

  <script src="/wasm/eauth/eauth.js"></script>
  <script src="/wasm/crabs/crabs.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
